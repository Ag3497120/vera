[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verantyx-vera"
version = "0.1.0a1"
description = "Verantyx Vera α — deterministic cross-structure knowledge & reasoning engine (no LM, typed refusal)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Verantyx" }]
keywords = ["knowledge-graph", "symbolic", "deterministic", "mcp", "source-linked"]

[project.optional-dependencies]
ja = ["fugashi>=1.5,<2", "unidic-lite==1.0.8"]
hf = ["datasets", "huggingface_hub"]
mcp = ["mcp[cli]>=1.2,<2"]
obfuscate = ["cryptography"]
docs = ["pypdf"]
all = ["datasets", "huggingface_hub", "mcp[cli]>=1.2,<2", "cryptography", "pypdf", "fugashi>=1.5,<2", "unidic-lite==1.0.8"]

[project.scripts]
vera = "verantyx.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["verantyx*"]
namespaces = true

# The field app's page ships INSIDE the package rather than being generated in
# Python. It has to be one file a person can read and audit — a municipal IT
# reviewer should be able to open it and confirm for themselves that nothing
# loads from anywhere — and a page assembled from string fragments cannot be
# read that way.
[tool.setuptools.package-data]
"*" = ["*.json", "*.html"]
