# Vera Harness CI.  Everything is offline: no API key is configured and none is needed (the backends are tested with fake clients).
#
# Python is pinned to 3.11.14: every ledger header records the Python it was made under and a replay refuses any other (ledger.header_mismatch), so the stored fixtures and the golden
# digests are asserted on exactly that version.  The tokenizer (fugashi 1.5.2, unidic-lite 1.0.8) decides the units and is pinned in .github/constraints.txt.
#
# tests    the whole suite (tests/core = the loom and the grammar layer, tests/harness = backends, runner, CLI), sharded by file, under PYTHONHASHSEED 0, 1 and 12345.
#          Linux has no sandbox-exec: node ids listed in .github/macos-only.txt are deselected (none today).
# replay   every stored ledger under tests/fixtures/ledgers: chain, then replay byte for byte (tools/verify_fixtures.py), under the same three seeds.
# install  a clean venv: `pip install .`, `vera --version`, `vera --help`, `vera verify` of a fixture; the package data (prompts, tool schemas, grammar data) must be inside the wheel.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      shards:
        description: "shards per seed (by test file)"
        default: "4"
        type: string

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_CONSTRAINT: "${{ github.workspace }}/.github/constraints.txt"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: python3 -c "n=max(1,min(16,int('${{ inputs.shards || '4' }}'))); print('shards=' + str(list(range(n))))" >> "$GITHUB_OUTPUT"

  tests:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 12345]
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11.14" }
      - run: python -m pip install --quiet -e ".[anthropic,openai,mcp]" pytest
      - name: pytest (shard ${{ matrix.shard }}, seed ${{ matrix.seed }})
        run: |
          N=$(python -c "import json; print(len(json.loads('${{ needs.plan.outputs.shards }}')))")
          FILES=$(ls tests/core/test_*.py tests/harness/test_*.py | sort | awk -v n="$N" -v s="${{ matrix.shard }}" 'NR % n == s')
          echo "$FILES"
          DESEL=$(grep -v '^#' .github/macos-only.txt | grep -v '^$' | sed 's/^/--deselect /' | tr '\n' ' ')
          python -m pytest -q -p no:cacheprovider --junitxml=junit.xml $DESEL $FILES || rc=$?
          rc=${rc:-0}; [ "$rc" = 5 ] && rc=0   # 5 = no test selected in this shard
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-seed${{ matrix.seed }}-shard${{ matrix.shard }}
          path: junit.xml

  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 12345]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11.14" }
      - run: python -m pip install --quiet -e ".[mcp]"
      - run: python tools/verify_fixtures.py | tee replay.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-seed${{ matrix.seed }}
          path: replay.txt

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11.14" }
      - name: wheel in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet build
          /tmp/venv/bin/python -m build --wheel --outdir /tmp/dist .
          /tmp/venv/bin/pip install --quiet /tmp/dist/*.whl
          cd /tmp && /tmp/venv/bin/vera --version && /tmp/venv/bin/vera --help > /dev/null
          /tmp/venv/bin/python - <<'PY'
          import importlib.resources as r, json, verantyx.harness as h
          base = r.files("verantyx.harness")
          assert json.loads(base.joinpath("loom_tools.json").read_text(encoding="utf-8"))
          for n in ("loom_record_only", "mem_story", "mem_question"):
              assert base.joinpath("prompts", n + ".txt").read_text(encoding="utf-8")
          assert r.files("verantyx").joinpath("lang_data", "ja_grammar.json").read_text(encoding="utf-8")
          from verantyx.harness.cli import main
          print("package data ok")
          PY
