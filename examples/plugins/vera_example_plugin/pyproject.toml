[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-example-plugin"
version = "0.1.0"
description = "A minimal Vera Harness plugin: a gate filter and a note kind"
requires-python = ">=3.10"
dependencies = ["vera-harness"]

[project.entry-points."vera.plugins"]
vera-example = "vera_example_plugin:plugins"

[tool.setuptools]
py-modules = ["vera_example_plugin"]
